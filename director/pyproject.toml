[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dungeon-director"
version = "0.1.0"
description = "Provider-independent dungeon director service for the ai-hack-poc roguelike."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "jsonschema>=4.18",
    # The OpenTelemetry API, SDK and OTLP exporter release in lockstep; all three
    # are pinned to the release the telemetry tests run against.
    "opentelemetry-api==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "pydantic>=2.6,<3",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "jsonschema>=4.18",
    "pytest>=8",
    "pyyaml>=6.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["dungeon_director*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: makes real billable provider calls; requires provider-specific opt-in and credentials",
    "live_cerebras: makes real billable Cerebras calls; requires RUN_LIVE_CEREBRAS=1 and credentials",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
